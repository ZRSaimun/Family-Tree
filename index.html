<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Interactive bilingual family tree for the Nayeb Chowdhury lineage." />
  <meta name="theme-color" content="#173a63" />
  <title>Family Heritage Tree</title>
  <link rel="icon" href="family-tree-icon.svg?v=9" type="image/svg+xml" />
  <link rel="stylesheet" href="family-v2.css?v=9" />
  <link rel="stylesheet" href="stability-fixes.css?v=7" />
  <link rel="stylesheet" href="family-v3.css?v=9" />
  <link rel="stylesheet" href="family-v7-extras.css?v=2" />
  <link rel="stylesheet" href="cinematic-show.css?v=1" />
  <link rel="stylesheet" href="legacy-highlights.css?v=1" />
  <link rel="stylesheet" href="memorial-status.css?v=1" />
  <link rel="stylesheet" href="admin-different-family.css?v=4" />
  <link rel="stylesheet" href="admin-different-family-menu.css?v=1" />
  <link rel="stylesheet" href="admin-land.css?v=1" />
  <link rel="stylesheet" href="admin-land-enhancements.css?v=1" />
  <link rel="stylesheet" href="public-cadastral-map.css?v=2" />
  <script>
    (async function(){
      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(r => r.unregister()));
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map(k => caches.delete(k)));
        }
      } catch (_) {}
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#top" aria-label="Family tree home"><span class="brand-mark">FT</span><span><strong>Family Heritage Tree</strong><small>Nayeb Chowdhury lineage</small></span></a>
    <div class="lang-switch" role="group" aria-label="Language selector"><button class="lang-btn active" type="button" data-lang="en">English</button><button class="lang-btn" type="button" data-lang="bn">বাংলা</button></div>
  </header>

  <main id="top">
    <section class="intro">
      <div><h1 id="pageTitle">Our Family Tree</h1><p id="pageSubtitle">Explore the Nayeb Chowdhury family as one connected living tree.</p></div>
      <div class="intro-aside"><p class="source-note" id="sourceNote"></p><p class="canvas-hint" id="canvasHint"></p></div>
    </section>

    <section class="controls" aria-label="Tree controls">
      <div class="search-wrap"><label class="search-box"><input id="searchInput" type="search" autocomplete="off" placeholder="Search a family member…" /><button id="clearSearch" class="clear-search hidden" type="button" aria-label="Clear search">×</button></label><div id="searchResults" class="search-results"></div></div>
      <button id="expandAllBtn" class="tool-btn" type="button">Expand all</button>
      <button id="fitBtn" class="tool-btn" type="button">Fit tree</button>
      <button id="homeBtn" class="tool-btn secondary-hide" type="button">Home</button>
      <button id="clearFocusBtn" class="tool-btn emphasis hidden" type="button">Show full tree</button>
      <button id="fullscreenBtn" class="tool-btn secondary-hide" type="button">Full screen</button>
      <div class="zoom-group" aria-label="Zoom controls"><button id="zoomOut" type="button" aria-label="Zoom out">−</button><span id="zoomReadout" class="zoom-readout">82%</span><button id="zoomIn" type="button" aria-label="Zoom in">+</button></div>
    </section>

    <div class="legend" id="legend"></div>
    <section id="familyCanvas" class="canvas-shell" aria-label="Interactive family tree canvas">
      <div id="treeZoom" class="tree-zoom"><div id="treeHost"><div style="padding:28px;text-align:center;color:#6b7280;font:600 14px system-ui">Loading family tree…</div></div></div>
    </section>
  </main>

  <footer class="footer">Family Heritage Tree • Click a person for details • Drag to move • Search to focus a branch</footer>
  <div id="profileBackdrop" class="profile-backdrop"></div>
  <aside id="profilePanel" class="profile-panel" aria-hidden="true" aria-label="Family profile"><button id="profileClose" class="profile-close" type="button" aria-label="Close">×</button><div id="profileContent"></div></aside>
  <div id="toast" class="toast" role="status"></div>

  <noscript><div style="padding:30px;font-family:system-ui">JavaScript is required to display the interactive family tree.</div></noscript>

  <script src="data.js?v=9"></script>
  <script src="corrections.js?v=9"></script>
  <script src="final-fixes.js?v=11"></script>
  <script src="backend-config.js?v=4"></script>
  <script src="backend-preload.js?v=3"></script>
  <script src="family-expansion.js?v=1"></script>
  <script src="family-v2.js?v=9"></script>
  <script src="stability-fixes.js?v=7"></script>
  <script src="family-platform-stable.js?v=9"></script>
  <script src="family-v7-extras.js?v=2"></script>
  <script src="cloud-loader.js?v=1"></script>
  <script src="cinematic-show.js?v=1"></script>
  <script src="legacy-highlights.js?v=1"></script>
  <script src="memorial-status.js?v=1"></script>
  <script src="admin-different-family.js?v=4"></script>
  <script src="admin-different-family-menu.js?v=1"></script>
  <script src="admin-land.js?v=1"></script>
  <script src="admin-land-enhancements.js?v=1"></script>
  <script src="public-land-property.js?v=1"></script>
  <script src="public-cadastral-map.js?v=2"></script>
  <script>
    window.addEventListener('load', function(){
      setTimeout(function(){
        const host = document.getElementById('treeHost');
        if (host && !host.querySelector('.person-card')) {
          host.innerHTML = '<div style="margin:24px;padding:24px;border:1px solid #e5e7eb;border-radius:16px;background:#fff;color:#374151;font:600 14px/1.5 system-ui"><b>Family tree could not start.</b><br>Please reload this page once. If this message remains, send a screenshot of this exact message.</div>';
        }
      }, 2200);
    });
  </script>
</body>
</html>
